name: Auto-generate config.js

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audio/APPROVED/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Remove REJECTED_ and check for actionable files
        id: check
        run: |
          find audio/APPROVED -name 'REJECTED_*' -delete
          if find audio/APPROVED -type f ! -name 'PENDING_*' -print -quit | grep -q .; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.check.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - if: steps.check.outputs.run == 'true'
        run: node scripts/generate-config.js

      - if: steps.check.outputs.run == 'true'
        name: Commit updated config.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to config.js"
          else
            git commit -m "Auto-update config.js [skip ci]"
            git remote set-url origin https://${{ github.actor }}:${{ secrets.PAT }}@github.com/${{ github.repository }}
            git pull --rebase
            git push
          fi
